name: Copia de la lista
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copia-lista.yml
      - .github/scripts/copia-lista.js
permissions:
  contents: write
jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/copia-lista.js
      - run: |
          git add lista-minorista.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Copia de la lista"
          git pull --rebase
          git push
