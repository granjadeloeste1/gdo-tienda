name: Copia de la lista
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copia-lista.yml
      - .github/scripts/copia-lista.js
permissions:
  contents: write
jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      # Fijadas a un commit (no a la etiqueta v4, que se puede mover): si alguien
      # tomara la cuenta de la acción, no corre código nuevo con permiso de escribir el repo.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node .github/scripts/copia-lista.js
      - run: |
          git add lista-minorista.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Copia de la lista"
          git pull --rebase
          git push
