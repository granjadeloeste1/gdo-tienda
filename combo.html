<style>

.ok p{color:#4a443d;line-height:1.5;margin:6px 0}

.btn2.pay{background:var(--ne)}
/* Cartel "sumá productos y el envío te sale sin cargo" (antes de confirmar un envío) */
.up{position:fixed;inset:0;z-index:20;background:rgba(17,17,17,.55);display:flex;align-items:flex-end;justify-content:center}
.upbox{background:var(--cr);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 18px 0}
.upbox h3{font:800 24px/1.15 var(--slab);margin:4px 0 10px}
.prog{height:10px;background:#e8e1d8;border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--or);border-radius:99px;transition:width .25s}
.uprow{background:#fff;border-radius:14px;padding:12px;margin-top:10px;box-shadow:0 1px 0 var(--li)}
.uprow b.t{display:block;font:700 15px var(--sans);margin-bottom:8px}
.uprow .l2{display:flex;gap:8px;align-items:center}
.uprow select{flex:1;min-width:0;font:500 14px var(--sans);padding:10px;border:1.5px solid var(--li);border-radius:10px;background:#fff}
.mini{display:flex;align-items:center;gap:6px}.mini button{width:36px;height:36px;border-radius:9px;border:0;background:var(--cr);font:700 20px var(--sans)}

.uprow .pr{font-size:13px;color:var(--mu);margin-top:6px}
.upfoot{position:sticky;bottom:0;background:var(--cr);padding:12px 0 calc(14px + env(safe-area-inset-bottom));margin-top:12px;border-top:1px solid var(--li)}

.upfoot button b{font:800 18px var(--slab);color:var(--am)}
.upfoot a{display:block;text-align:center;margin-top:10px;color:var(--mu);font-size:14px;text-decoration:underline}
</style></head>

<script>
(function(){
  var VERSION='combo v1.5';
  // Pago online con la API de Nave: el servidor del bot (src/nave.js) crea UN cobro por pedido con
  // el monto calculado allá con la lista en vivo. (Los links de pago de Nave son de un solo uso.)
  // Si el servidor dice que está apagado o no responde, se ofrece solo pagar al recibir.
  var NAVE_API='https://gdo-bot-whatsapp-production.up.railway.app/nave';
  var ONLINE='Pago online (dinero en cuenta, desde tu banco o billetera)';
  var NAVE_ON=false;
  // Solo para este combo: envío FIJO a cualquier zona (sin cargo desde el monto de envío gratis de la
  // hoja) y retiro en el local en el horario de mostrador.
  var ENVIO_FIJO=7000;
  var HORARIO_RETIRO='lunes a sábado de 6 a 13:30';
  // Productos que se ofrecen para llegar al envío sin cargo (precios EN VIVO de la lista minorista).
  var GRUPOS=[
    ['Milanesas de pollo', function(p){ return p.sub==='MILANESAS DE POLLO'; }],
    ['Milanesas rellenas', function(p){ return p.sub==='MILANESAS RELLENAS'; }],
    ['Supremas rellenas', function(p){ return p.sub==='SUPREMAS RELLENAS'; }],
    ['Hamburguesas', function(p){ return p.sub==='HAMBURGUESAS'; }],
    ['Trozado de pollo fresco', function(p){ return /TROZADO DE POLLO FRESCO/.test(p.cat); }],
    ['Albóndigas', function(p){ return /ALB[OÓ]NDIGAS/.test(p.sub); }],
    ['Arrollados de pollo', function(p){ return p.sub==='ARROLLADOS'; }],
    ['Huevos', function(p){ return p.cat==='HUEVO'; }]
  ];
  var EXTRA={}, UPG=[];
  // El total solo está definido si ya eligió zona (envío) o retiro.
  function hayOnline(){ return NAVE_ON && !(st.modo==='envio' && st.zona==null); }
  var API='https://script.google.com/macros/s/AKfycbwH6JW35BRYcBk958OEr4sEvfVIfzgqzQeGwvz63xZYgukwxik8EsIego4d9O456bHURg/exec';
  var WA='5491135800164';
  var ITEMS=[['2 kg','Milanesa de pollo','mila'],['2 kg','Papas bastón','papas'],['3 kg','Cuarto trasero','cuarto'],['1 kg','Hamburguesa de pollo clásica','burga'],['1','Maple de huevos','huevos']];
  var app=document.getElementById('app');
  function $(id){ return document.getElementById(id); }
  function money(n){ return '$'+Number(n||0).toLocaleString('es-AR'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
  function cap(s){ s=String(s||'').toLowerCase(); return s.charAt(0).toUpperCase()+s.slice(1); }
  var TOP='<div class="top"><img src="assets/logo-horizontal-blanco.svg" alt="Granja del Oeste"></div>';

  // Fechas: igual que la tienda (24 hs de anticipación, nunca el mismo día).
  var DIA_IDX={domingo:0,lunes:1,martes:2,miercoles:3,jueves:4,viernes:5,sabado:6};
  function sinTilde(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toLowerCase(); }
  function proxFechaDia(n){ var di=DIA_IDX[sinTilde(n)]; if(di==null) return null; var b=new Date(); b.setHours(0,0,0,0); var d=(di-b.getDay()+7)%7; if(d===0) d=7; b.setDate(b.getDate()+d); return b; }
  var NOMDIA=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  function fmtF(d){ return d? d.getDate()+'/'+(d.getMonth()+1) : ''; }
  function isoF(d){ return d? d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') : ''; }
  function nid(){ var a=new Uint8Array(16); crypto.getRandomValues(a); var s=''; for(var i=0;i<a.length;i++) s+=('0'+a[i].toString(36)).slice(-2); return 'p_'+s; }

  var CFG=null, COMBO=null, TARTAS=[], TARTA_PRECIO=0;
  var st={ cant:1, modo:'envio', zona:null, dia:null, diaF:'', diaIso:'', tartas:[''], extras:{} };

  // ¿Está prendido el cobro online? (no frena la carga: si contesta tarde, se suma la opción).
  fetch(NAVE_API+'/estado').then(function(r){ return r.json(); }).then(function(j){ NAVE_ON=!!(j&&j.activo); if(COMBO && $('pago')) upd(); }).catch(function(){});

  // Vuelta del checkout de Nave (?pago=<pedido>): se consulta cómo quedó el pago.
  var VUELTA=(location.search.match(/[?&]pago=(p_[a-z0-9]+)/)||[])[1];
  if(VUELTA){
    var intentos=0;
    var mirar=function(){
      fetch(NAVE_API+'/pago/'+VUELTA).then(function(r){ return r.ok?r.json():{}; }).catch(function(){ return {}; }).then(function(j){
        var ok=j.estado==='APPROVED';
        if(!ok && ++intentos<8){ app.innerHTML=TOP+'<div class="ok"><div class="ic">…</div><h1>Confirmando tu pago</h1><p>Esperamos la confirmación de Nave. Puede tardar unos segundos.</p></div>'; return setTimeout(mirar,3000); }
        app.innerHTML=TOP+'<div class="ok"><div class="ic">'+(ok?'✓':'!')+'</div><h1>'+(ok?'Pago recibido.':'Tu pedido está tomado.')+'</h1>'+
          '<p>'+(ok?'Gracias. Ya registramos el pago de <b>'+money(j.monto)+'</b> y preparamos tu combo.':'Todavía no vemos el pago acreditado. Si pagaste, no te preocupes: lo revisamos y te escribimos. Si no, pagás al recibir.')+'</p>'+
          '<a class="btn2" href="https://wa.me/'+WA+'?text='+encodeURIComponent('Hola! Hice el pedido del Combo fin de mes ('+VUELTA+').')+'" target="_blank" rel="noopener">Escribinos por WhatsApp</a>'+
          '<a class="mas" href="vista-minorista.html"><span>Mirá la lista completa</span> →</a></div>';
      });
    };
    mirar();
  }

  fetch(API+'?lista=minorista&t='+Date.now()).then(function(r){ return r.json(); }).then(function(d){
    CFG=d.config||{}; var ps=d.productos||[];
    COMBO=ps.filter(function(p){ return /COMBO/i.test(p.cat) && /^COMBO$/i.test(String(p.nombre).trim()); })[0];
    var ts=ps.filter(function(p){ return /TARTAS INDIVIDUALES/i.test(p.cat); });
    TARTAS=ts.map(function(p){ return cap(String(p.nombre).replace(/^TARTA INDIVIDUAL DE\s*/i,'')); });
    TARTA_PRECIO=ts.length?ts[0].precio:0;
    // Extras: un producto por nombre; si todas sus variedades son "N kg" se vende por kg con escala.
    GRUPOS.forEach(function(g){
      var noms=[];
      ps.filter(g[1]).forEach(function(p){
        var e=EXTRA[p.nombre];
        if(!e){ e=EXTRA[p.nombre]={ nombre:p.nombre, label:cap(String(p.nombre).replace(/\s+X\s+(KG|UNIDAD)$/i,'').replace(/\s+/g,' ')).replace(/^Maple b1$/,'Maple de huevos'), vars:[] }; noms.push(p.nombre); }
        e.vars.push({ variedad:p.variedad, precio:p.precio });
      });
      noms.forEach(function(n){
        var e=EXTRA[n], kg=e.vars.map(function(v){ var m=/^(\d+(?:[.,]\d+)?)\s*kg$/i.exec(String(v.variedad).trim()); return m?parseFloat(m[1].replace(',','.')):null; });
        e.porKg=kg.every(function(x){ return x!=null; });
        if(e.porKg) e.tiers=e.vars.map(function(v,i){ return { min:kg[i], perkg:v.precio }; }).sort(function(a,b){ return a.min-b.min; });
        e.min=e.porKg && /MILANES/i.test(g[0])?2:1;   // las milanesas van por mínimo 2 kg, como en la tienda
      });
      if(noms.length) UPG.push({ titulo:g[0], noms:noms });
    });
    if(VUELTA) return;
    if(!COMBO){ app.innerHTML=TOP+'<div class="off">El combo no está disponible en este momento.<a class="mas" href="vista-minorista.html"><span>Ver la lista completa</span></a></div>'; return; }
    gdoPx('ViewContent',{content_name:'Combo fin de mes',value:COMBO.precio,currency:'ARS',content_type:'product'});
    render();
  }).catch(function(){
    // Regla de la tienda: sin conexión NO se muestran precios.
    app.innerHTML=TOP+'<div class="off">No pudimos cargar el combo. Revisá tu conexión y probá de nuevo.<br><br><button class="opt" onclick="location.reload()">Reintentar</button></div>';
  });

  function sub(){ return COMBO.precio*st.cant; }
  function precioExtra(e,q){ if(!e.porKg) return e.vars[0].precio; var t=e.tiers[0]; e.tiers.forEach(function(x){ if(q>=x.min) t=x; }); return t.perkg; }

  function upd(){
    // Una tarta de regalo por combo, cada una con su sabor.
    while(st.tartas.length<st.cant) st.tartas.push(''); st.tartas.length=st.cant;
    $('tartasBox').innerHTML=st.tartas.map(function(v,i){
      return '<label class="fl">Tu tarta de regalo'+(st.cant>1?' · combo '+(i+1):'')+' — elegí el sabor</label><div class="chips" data-i="'+i+'">'+
        TARTAS.map(function(t){ return '<button type="button" class="chip'+(t===v?' on':'')+'" data-t="'+esc(t)+'">'+esc(t)+'</button>'; }).join('')+'</div>';
    }).join('');
    app.querySelectorAll('.chips').forEach(function(c){ c.querySelectorAll('.chip').forEach(function(b){ b.onclick=function(){ st.tartas[+c.dataset.i]=b.dataset.t; c.querySelectorAll('.chip').forEach(function(x){ x.classList.toggle('on',x===b); }); }; }); });
    $('qn').textContent=st.cant; $('tc').textContent=st.cant;
    var e=envio(), s=sub(), pr=productos(), tn=$('tn');
    $('ts').textContent=money(s);
    $('exL').innerHTML=Object.keys(st.extras).filter(function(n){ return st.extras[n]>0; }).map(function(n){ var x=EXTRA[n], q=st.extras[n]; return '<div class="ln"><span>'+esc(x.label)+' · '+uniExtra(x,q)+'</span><span>'+money(precioExtra(x,q)*q)+'</span></div>'; }).join('');

    else { tn.style.display='block'; var falta=CFG.envioGratisDesde-pr; tn.className='free'+(falta>0?' no':''); tn.textContent=falta>0?'Sumando '+money(falta)+' más en productos, el envío es sin cargo.':'Tu envío es sin cargo.'; }
    // Formas de pago: el pago online aparece primero (y elegido) cuando hay link para este total.

    ps.innerHTML=ops.map(function(f){ return '<option>'+esc(f)+'</option>'; }).join('');
    ps.value=(link && (!antes || !st.pagoTocado))?ONLINE:(ops.indexOf(antes)>=0?antes:ops[0]);
    ps.onchange=function(){ st.pagoTocado=true; pagoHint(); };
    pagoHint();
  }

  }

  function enviar(listo){
    var err=$('err'); err.textContent='';
    var nom=$('nom').value.trim(), tel=$('tel').value.trim(), pago=$('pago').value;
    function falla(t, el){ err.textContent=t; if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); }
    if(st.tartas.some(function(t){ return !t; })) return falla('Elegí el sabor de tu tarta de regalo.', $('tartasBox'));
    if(st.modo==='envio'){ if(st.zona==null) return falla('Elegí tu zona de entrega.', $('zona')); if(!st.dia) return falla('Elegí el día de entrega.', $('diasBox')); if(!$('dir').value.trim()) return falla('Completá tu dirección.', $('dir')); }
    if(!nom) return falla('Completá tu nombre.', $('nom'));
    if(tel.replace(/\D/g,'').length<8) return falla('Revisá tu número de WhatsApp.', $('tel'));
    // Envío por debajo del monto de envío gratis: antes de confirmar se ofrece sumar productos.
    if(listo!==true && st.modo==='envio' && CFG.envioGratis && productos()<CFG.envioGratisDesde && UPG.length) return sumarMas();
    var s=sub(), px=extrasTotal(), e=envio(), total=s+px+e, esEnv=st.modo==='envio';
    var dir=esEnv?$('dir').value.trim():'', entre=esEnv?$('entre').value.trim():'', zona=esEnv?CFG.zonas[st.zona].nombre:'';
    var diaR=esEnv?'':$('diaR').value.trim();
    var lat=null,lng=null; if(st.geo && st.geo.lat!=null && st.geo.direccion && st.geo.direccion.toLowerCase()===dir.toLowerCase()){ lat=st.geo.lat; lng=st.geo.lng!=null?st.geo.lng:st.geo.lon; }
    var items=[{ producto:'COMBO FIN DE MES ('+COMBO.desc+')', cantidad:st.cant, unidad:'unidad', precio:COMBO.precio, preparacion:'', nota:'' }];
    var cuenta={}; st.tartas.forEach(function(t){ cuenta[t]=(cuenta[t]||0)+1; });
    Object.keys(cuenta).forEach(function(t){ items.push({ producto:'TARTA INDIVIDUAL DE '+t.toUpperCase()+' (REGALO COMBO)', cantidad:cuenta[t], unidad:'unidad', precio:0, preparacion:'', nota:'' }); });
    var extras=Object.keys(st.extras).filter(function(n){ return st.extras[n]>0; });
    extras.forEach(function(n){ var x=EXTRA[n], q=st.extras[n]; items.push(x.porKg
      ? { producto:x.nombre, cantidad:q, unidad:'kg', precio:precioExtra(x,q), preparacion:'', nota:'' }
      : { producto:x.nombre+' ('+x.vars[0].variedad+')', cantidad:q, unidad:'unidad', precio:x.vars[0].precio, preparacion:'', nota:'' }); });
    var esp=esEnv?['MINORISTA','COMBO FIN DE MES (anuncio)','Zona: '+zona,'Día de entrega: '+st.dia+' '+st.diaF,'Envío: '+(e===0?'sin cargo':money(e))]
                 :['MINORISTA','COMBO FIN DE MES (anuncio)','Retiro en sucursal: '+CFG.sucursal].concat(diaR?['Día de retiro: '+diaR]:[]);
    var online=(pago===ONLINE)&&hayOnline();
    if(online) esp.push('PAGO ONLINE NAVE: verificar que se acreditó '+money(total)+' antes de entregar');
    esp.push('TOTAL a cobrar: '+money(total));
    var pedido={ id:nid(), origen:'tienda', lista:'minorista', fuente:'landing-combo-fin-de-mes', cliente:nom, telefono:tel,
      modalidad:esEnv?'envio':'retiro', direccion:dir, localidad:'', entrecalles:entre, lat:lat, lng:lng,
      items:items, fechaEntrega:esEnv?st.diaIso:'', especificaciones:esp.join(' · '), formaPago:pago, prioridad:'normal',
      estado:'pendiente', creadoPor:null, rutaId:null, clienteUid:null, totalEstimado:Math.round(s+px), descuento:null,
      zona:zona, diaEntrega:esEnv?st.dia:diaR, envio:Math.round(e), ventana:'', historia:[], creado:Date.now(), ts:Date.now() };
    gdoPx('Purchase',{value:total,currency:'ARS',num_items:st.cant,content_name:'Combo fin de mes',content_type:'product'});
    var guardado=guardar(pedido);
    if(online){
      // Se pide el cobro a Nave (monto calculado en el servidor) y se va al checkout en ESTA pestaña
      // (en el celular, Nave abre MODO o la app del banco). Antes se espera el guardado del pedido,
      // como mucho 4 s: queda encolado (persistencia offline + respaldo local) aunque no confirme.
      $('go').disabled=true; $('go').innerHTML='<span>Abriendo el pago seguro…</span>';
      fetch(NAVE_API+'/combo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pedidoId:pedido.id,cant:st.cant,modo:st.modo,zona:st.zona})})
        .then(function(r){ return r.ok?r.json():Promise.reject(new Error('nave '+r.status)); })
        .then(function(j){
          if(!j.checkoutUrl || Math.round(j.monto)!==Math.round(total)) throw new Error('monto distinto');
          return Promise.race([guardado,new Promise(function(r){ setTimeout(r,4000); })]).then(function(){ location.href=j.checkoutUrl; });
        })
        .catch(function(){ confirmado(true); });
      return;
    }
    confirmado(false);
    function confirmado(falloPago){
      // Aviso opcional por WhatsApp (el pedido YA quedó cargado en el panel).
      var L=['Hola! Hice el pedido del *Combo fin de mes* desde la web.','','• '+st.cant+' combo'+(st.cant>1?'s':'')+' + tarta de '+st.tartas.join(', ').toLowerCase()].concat(extras.map(function(n){ return '• '+EXTRA[n].label+' · '+uniExtra(EXTRA[n],st.extras[n]); })).concat([
        esEnv?'• Envío a '+dir+' · '+st.dia+' '+st.diaF:'• Retiro en el local'+(diaR?' · '+diaR:''),'• Pago: '+pago,'• Total: '+money(total),'','A nombre de '+nom+'.']);
      var wa='https://wa.me/'+WA+'?text='+encodeURIComponent(L.join('\n'));
      window.scrollTo(0,0);
      app.innerHTML=TOP+'<div class="ok"><div class="ic">✓</div><h1>Pedido confirmado, '+esc(nom.split(' ')[0])+'.</h1>'+
        '<p>Ya lo tenemos. '+(esEnv?'Te lo llevamos el <b>'+esc(st.dia)+' '+esc(st.diaF)+'</b>.':'Te esperamos en <b>'+esc(CFG.sucursal)+'</b>.')+'</p>'+
        '<div class="card sum"><div class="ln"><span>'+st.cant+' × Combo fin de mes</span><span>'+money(s)+'</span></div><div class="ln"><span>Tarta de '+esc(st.tartas.join(', ').toLowerCase())+'</span><span>Regalo</span></div>'+
          extras.map(function(n){ var x=EXTRA[n], q=st.extras[n]; return '<div class="ln"><span>'+esc(x.label)+' · '+uniExtra(x,q)+'</span><span>'+money(precioExtra(x,q)*q)+'</span></div>'; }).join('')+
          (esEnv?'<div class="ln"><span>Envío</span><span>'+(e===0?'Sin cargo':money(e))+'</span></div>':'')+'<div class="ln big"><span>Total</span><span>'+money(total)+'</span></div></div>'+
        (falloPago?'<p style="font-size:14px;color:#6d665e">No pudimos abrir el pago online en este momento. Tu pedido quedó tomado igual: pagás '+(esEnv?'al recibir':'al retirar')+'.</p>':'<p style="font-size:14px;color:#6d665e">Pagás '+(esEnv?'al recibir':'al retirar')+' con '+esc(pago.toLowerCase())+'.</p>')+
        '<a class="btn2" href="'+wa+'" target="_blank" rel="noopener">Avisarnos por WhatsApp</a>'+
        '<a class="mas" href="vista-minorista.html"><span>Mirá la lista completa</span> →</a></div>';
    }
  }

  // Cartel antes de confirmar un ENVÍO que no llega al envío sin cargo: ofrece sumar productos de la
  // lista minorista (milanesas, rellenas, hamburguesas, trozado fresco…) con sus precios en vivo.
  function sumarMas(){
    var ov=document.createElement('div'); ov.className='up';
    var sel={}; UPG.forEach(function(g){ sel[g.titulo]=g.noms.filter(function(n){ return st.extras[n]>0; })[0]||g.noms[0]; });
    function fila(g){
      var n=sel[g.titulo], x=EXTRA[n], q=st.extras[n]||0;
      var pr=x.porKg?money(precioExtra(x,Math.max(q,x.min)))+' el kg'+(x.tiers.length>1?' · baja llevando más':''):money(x.vars[0].precio)+(/^unidad$/i.test(x.vars[0].variedad||'unidad')?' c/u':' por '+String(x.vars[0].variedad).toLowerCase().replace(/^\d+\s*/,'').replace(/s$/,''));
      return '<div class="uprow" data-g="'+esc(g.titulo)+'"><b class="t">'+esc(g.titulo)+'</b><div class="l2">'+
        (g.noms.length>1?'<select>'+g.noms.map(function(m){ return '<option value="'+esc(m)+'"'+(m===n?' selected':'')+'>'+esc(EXTRA[m].label)+'</option>'; }).join('')+'</select>':'<span style="flex:1;font-size:14px">'+esc(x.label)+'</span>')+
        '<div class="mini"><button type="button" data-d="-1" aria-label="Menos">−</button><span>'+(q?uniExtra(x,q):'—')+'</span><button type="button" data-d="1" aria-label="Más">+</button></div></div><div class="pr">'+pr+'</div></div>';
    }
    function pintar(){
      var pr=productos(), meta=CFG.envioGratisDesde, falta=Math.max(0,meta-pr), e=envio();
      ov.innerHTML='<div class="upbox"><div class="h2">Antes de confirmar</div><h3>'+(falta?'Sumá '+money(falta)+' y el envío te sale sin cargo':'¡Listo! Tu envío es sin cargo')+'</h3>'+
        '<div class="prog"><i style="width:'+Math.min(100,Math.round(pr/meta*100))+'%"></i></div>'+
        '<div class="hint">'+(falta?'Hoy pagarías '+money(e)+' de envío. Agregá lo que quieras de la lista:':'Ya sumaste '+money(pr)+' en productos.')+'</div>'+
        UPG.map(fila).join('')+
        '<div class="upfoot"><button type="button" id="upOk"><span>Confirmar pedido</span><b>'+money(pr+e)+'</b></button>'+
        (Object.keys(st.extras).some(function(n){ return st.extras[n]>0; })?'':'<a href="#" id="upNo">No, gracias. Confirmar con envío de '+money(ENVIO_FIJO)+'</a>')+'</div></div>';
      ov.querySelectorAll('.uprow').forEach(function(r){
        var g=r.dataset.g, s2=r.querySelector('select');
        if(s2) s2.onchange=function(){ sel[g]=s2.value; pintar(); };
        r.querySelectorAll('.mini button').forEach(function(b){ b.onclick=function(){
          var n=sel[g], x=EXTRA[n], q=st.extras[n]||0, d=+b.dataset.d;
          q = d>0 ? (q?q+1:x.min) : (q>x.min?q-1:0);
          if(q) st.extras[n]=q; else delete st.extras[n];
          upd(); pintar();
        }; });
      });
      ov.querySelector('#upOk').onclick=function(){ ov.remove(); enviar(true); };
      var no=ov.querySelector('#upNo'); if(no) no.onclick=function(ev){ ev.preventDefault(); ov.remove(); enviar(true); };
    }
    ov.onclick=function(ev){ if(ev.target===ov){ ov.remove(); } };
    document.body.appendChild(ov); pintar();
  }

  // Guarda en /pedidos igual que la tienda: espera la sesión anónima, reintenta y deja respaldo local.
  function guardar(p){
    var INBOX='gdo_reparto_inbox';
    try{ var inb=JSON.parse(localStorage.getItem(INBOX)||'[]'); inb.push(p); localStorage.setItem(INBOX,JSON.stringify(inb)); }catch(e){}
    function drop(){ try{ var inb=JSON.parse(localStorage.getItem(INBOX)||'[]'); localStorage.setItem(INBOX,JSON.stringify(inb.filter(function(x){ return x&&x.id!==p.id; }))); }catch(e){} }
    function sesion(){ var au=GDO.FB.auth; if(au && au.currentUser) return Promise.resolve();
      return new Promise(function(res){ var un=au?au.onAuthStateChanged(function(u){ if(u){ try{un();}catch(e){} res(); } }):null; try{ if(au) au.signInAnonymously(); }catch(e){} setTimeout(res,6000); }); }
    function intento(n){ return sesion().then(function(){ return GDO.FB.db.collection('pedidos').doc(p.id).set(p); }).then(drop).catch(function(){ if(n>0) return new Promise(function(r){ setTimeout(r,1500); }).then(function(){ return intento(n-1); }); }); }
