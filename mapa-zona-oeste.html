<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zonas de Reparto — Zona Oeste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--negro:#161616;--tinta:#1c1c1c;--naranja:#F58220;--papel:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);
  font-family:"Patrick Hand",system-ui,Segoe UI,Roboto,sans-serif}
.card{max-width:560px;margin:0 auto;background:#fff;overflow:hidden}
.head{background:var(--negro);color:#fff;text-align:center;padding:16px 12px 14px}
.head h1{font-family:"Permanent Marker",cursive;margin:0;letter-spacing:1px;
  font-size:clamp(26px,7vw,40px);line-height:1}
.head h1 span{color:var(--naranja)}
.head .rule{width:64px;height:4px;background:var(--naranja);border-radius:3px;margin:9px auto 0}
.search{padding:14px 18px 2px}
.search input{width:100%;padding:11px 16px 11px 42px;border:2px solid #eee;border-radius:30px;
  font-family:inherit;font-size:17px;outline:none;background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%23999' stroke-width='2'><circle cx='9' cy='9' r='6'/><line x1='13.5' y1='13.5' x2='18' y2='18'/></svg>") 14px center no-repeat}
.search input:focus{border-color:var(--naranja)}
.banner{min-height:24px;text-align:center;font-size:17px;padding:8px 12px 2px}
.banner .ok{color:var(--naranja)}.banner .no{color:#c0392b}
svg#mapa{width:100%;height:auto;display:block}
.blob{cursor:pointer}
.blob .fill{fill:var(--tinta);transition:fill .15s}
.blob.on .fill{fill:var(--naranja)}
.blob.dim{opacity:.20}
/* Nombres de las localidades. El contorno oscuro es lo que los hace legibles
   tanto sobre el gris como sobre el naranja de la zona seleccionada. */
.lbl{font-family:"Patrick Hand",sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle;
  pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.72);stroke-width:.14em;
  stroke-linejoin:round;font-weight:700}
.zona{text-align:center;padding:6px 12px 8px}
.zona h2{font-family:"Permanent Marker",cursive;margin:0;color:var(--naranja);
  font-size:clamp(30px,9vw,52px);line-height:1;letter-spacing:1px}
.zona p{margin:5px 0 0;font-size:clamp(15px,4vw,19px);color:#444}
.foot{background:var(--negro);color:#fff;text-align:center;padding:13px 14px 16px}
.foot .b{font-family:"Permanent Marker",cursive;font-size:clamp(17px,5vw,24px);color:var(--naranja);letter-spacing:.5px}
.foot .s{font-size:clamp(13px,3.6vw,16px);opacity:.92;margin-top:3px}
#tip{position:fixed;pointer-events:none;z-index:9;background:#1c1c1c;color:#fff;padding:7px 11px;
  border-radius:10px;font-size:15px;opacity:0;transform:translate(-50%,-120%);transition:opacity .1s;
  white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.28)}
#tip .ok{color:var(--naranja)}
</style>
</head>
<body>
<div class="card">
  <div class="head"><h1>Zonas de <span>Reparto</span></h1><div class="rule"></div></div>
  <div class="search"><input id="q" type="text" placeholder="Buscá tu localidad…" autocomplete="off"></div>
  <div class="banner" id="banner">Buscá tu localidad o tocá tu zona en el mapa 🚚</div>
  <svg id="mapa" viewBox="0 0 1000 860" aria-label="Mapa Zona Oeste"></svg>
  <div class="zona"><h2>Zona Oeste</h2><p>Morón, Ituzaingó, Hurlingham y alrededores</p></div>
  <div class="foot"><div class="b">De lunes a sábados</div><div class="s">¡Elegí el día de entrega que prefieras!</div></div>
</div>
<div id="tip"></div>
<script>
const MAPDATA={"W":1000,"H":859.5,"cells":[{"n":"William Morris","p":[[210.5,212.5],[261.6,262.3],[251.3,273.5],[335.0,356.9],[356.5,335.4],[379.7,358.7],[395.1,342.9],[382.1,329.4],[421.4,290.2],[353.7,224.5],[446.8,131.3],[430.1,100.5],[455.3,75.1],[423.2,43.0],[385.1,58.0],[314.7,116.3],[290.1,127.6],[256.2,179.4],[210.5,212.5]],"lx":341.1,"ly":202.2},{"n":"Villa Udaondo","p":[[50.0,435.1],[101.4,486.7],[122.3,450.2],[118.1,445.4],[130.4,432.6],[122.7,400.3],[213.8,403.2],[338.1,425.1],[389.9,418.4],[386.2,407.8],[251.3,273.5],[261.6,262.3],[210.5,212.5],[167.7,233.5],[104.8,288.0],[74.7,353.6],[71.1,406.3],[50.0,435.1]],"lx":198.8,"ly":347.7},{"n":"Villa Tesei","p":[[335.0,356.9],[397.6,414.1],[485.8,420.9],[495.9,415.5],[509.9,422.6],[538.5,419.5],[550.4,354.7],[536.6,313.6],[511.4,309.6],[468.7,268.1],[443.1,299.1],[431.4,287.5],[394.7,311.1],[398.1,315.2],[382.0,329.7],[395.1,342.9],[379.7,358.7],[356.5,335.4],[335.0,356.9]],"lx":457.9,"ly":357.6},{"n":"El Palomar","p":[[532.9,304.6],[550.4,354.7],[536.6,427.1],[620.0,442.0],[691.5,440.3],[734.8,409.1],[747.0,414.2],[759.0,408.1],[681.3,278.5],[663.2,289.0],[557.2,179.7],[551.4,222.0],[535.0,256.2],[542.0,280.7],[532.9,304.6]],"lx":624.1,"ly":342.3},{"n":"Ciudad Jardín","p":[[579.9,203.2],[663.2,289.0],[681.3,278.5],[691.1,294.6],[721.1,276.2],[683.2,274.0],[708.1,220.6],[666.9,182.7],[596.6,180.0],[579.9,203.2]],"lx":651.0,"ly":227.4},{"n":"Ituzaingó","p":[[101.4,486.7],[327.9,714.7],[389.9,418.4],[338.1,425.1],[213.8,403.2],[122.7,400.3],[130.4,432.6],[118.1,445.4],[122.3,450.2],[101.4,486.7]],"lx":258.3,"ly":518.4},{"n":"Castelar","p":[[327.9,714.7],[357.6,744.4],[356.6,750.3],[446.6,816.5],[462.6,760.5],[470.0,704.3],[502.3,620.7],[490.5,615.6],[491.2,595.4],[481.1,593.1],[492.9,536.0],[522.6,463.5],[536.3,445.6],[538.5,419.5],[507.9,422.6],[495.9,415.5],[483.9,420.9],[388.1,409.9],[389.8,425.1],[327.9,714.7]],"lx":426.5,"ly":595.9},{"n":"Morón","p":[[453.2,795.4],[660.4,572.6],[535.7,446.4],[522.6,463.5],[492.9,536.0],[481.1,593.1],[491.2,595.4],[490.5,615.6],[502.3,620.7],[470.0,704.3],[453.2,795.4]],"lx":545.5,"ly":600.0},{"n":"Haedo","p":[[533.1,435.4],[536.0,446.7],[660.4,572.6],[717.9,515.1],[712.1,480.0],[731.6,476.8],[690.4,439.3],[620.0,442.0],[538.0,427.3],[533.1,435.4]],"lx":641.1,"ly":487.1},{"n":"Villa Sarmiento","p":[[691.5,440.3],[731.6,476.8],[764.6,470.5],[761.5,454.8],[801.1,449.6],[828.2,434.6],[780.8,387.0],[755.8,402.7],[759.0,408.1],[747.0,414.2],[734.8,409.1],[691.5,440.3]],"lx":759.1,"ly":434.3},{"n":"Ramos Mejía","p":[[707.2,521.5],[779.5,588.4],[814.7,635.4],[851.5,612.5],[932.5,527.8],[828.2,434.6],[801.1,449.6],[761.5,454.8],[764.6,470.5],[712.1,480.0],[717.9,515.1],[707.2,521.5]],"lx":817.5,"ly":528.1},{"n":"Ciudadela","p":[[786.7,392.5],[950.0,543.2],[941.3,368.8],[931.4,379.3],[901.8,351.8],[890.7,356.9],[884.8,343.7],[786.7,392.5]],"lx":888.5,"ly":425.7},{"n":"Hurlingham","p":[[353.7,224.5],[425.1,293.8],[431.4,287.5],[443.1,299.1],[468.7,268.1],[511.4,309.6],[536.6,313.6],[532.9,304.6],[542.1,276.3],[534.8,257.2],[551.4,222.0],[557.2,179.7],[454.6,74.9],[430.1,100.5],[446.8,131.3],[353.7,224.5]],"lx":467.9,"ly":206.9}]};
// Día de reparto por localidad: se LLENA desde la CONFIGURACIÓN del Drive (Apps Script),
// al final del script. Así, si cambiás los días en la planilla, el mapa se actualiza solo.
const DIAS={};
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("mapa"),tip=document.getElementById("tip"),banner=document.getElementById("banner");
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pathD(p,seed,amp){const r=rng(seed);let d="";for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];
  if(i===0)d+="M"+(a[0]+(r()-.5)*amp).toFixed(1)+" "+(a[1]+(r()-.5)*amp).toFixed(1);
  const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1,o=(r()-.5)*amp;
  d+="Q"+(mx-dy/l*o).toFixed(1)+" "+(my+dx/l*o).toFixed(1)+" "+(b[0]+(r()-.5)*amp).toFixed(1)+" "+(b[1]+(r()-.5)*amp).toFixed(1);}
  return d+"Z"}
const bbox=p=>{let a=1e9,b=1e9,c=-1e9,d=-1e9;p.forEach(q=>{a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[0]);d=Math.max(d,q[1])});return{x:a,y:b,w:c-a,h:d-b}};
const area=p=>{let s=0;for(let i=0;i<p.length;i++){const q=p[i],r=p[(i+1)%p.length];s+=q[0]*r[1]-r[0]*q[1]}return Math.abs(s)/2};

const els=[],labelLayer=document.createElementNS(NS,"g");labelLayer.setAttribute("pointer-events","none");
MAPDATA.cells.forEach((c,i)=>{
  const g=document.createElementNS(NS,"g");g.setAttribute("class","blob");
  const f=document.createElementNS(NS,"path");f.setAttribute("class","fill");
  f.setAttribute("d",pathD(c.p,i*131+7,1.4));
  f.setAttribute("stroke","#fff");f.setAttribute("stroke-width","2.6");f.setAttribute("stroke-linejoin","round");
  g.appendChild(f);svg.appendChild(g);
  const t=document.createElementNS(NS,"text");t.setAttribute("class","lbl");
  t.setAttribute("x",c.lx);t.setAttribute("y",c.ly);t.textContent=c.n;labelLayer.appendChild(t);
  const o={g,f,t,data:c,box:bbox(c.p),area:area(c.p)};els.push(o);
  g.addEventListener("mouseenter",e=>{g.classList.add("on");if(o.small)t.style.opacity=1;
    tip.innerHTML=`<b>${c.n}</b> · <span class="ok">✓ Repartimos acá</span>`+(DIAS[c.n]?`<div style="margin-top:2px;font-size:13px;opacity:.92">📅 <b>${DIAS[c.n]}</b></div>`:'');tip.style.opacity=1;mv(e)});
  g.addEventListener("mousemove",mv);
  g.addEventListener("mouseleave",()=>{if(!g.classList.contains("keep")){g.classList.remove("on");if(o.small)t.style.opacity=0}tip.style.opacity=0});
  g.addEventListener("click",()=>{document.getElementById("q").value=c.n;doSearch(c.n)});
});
svg.appendChild(labelLayer);
function mv(e){tip.style.left=e.clientX+"px";tip.style.top=e.clientY+"px"}

// Nombres cortos para las zonas angostas: entran enteros en vez de achicarse
// hasta ser ilegibles o desaparecer. Ramos Mejía, V. Sarmiento y Ciudadela eran
// las tres que quedaban cortadas.
const SHORT={"Villa Sarmiento":"V. Sarmiento","Villa Udaondo":"V. Udaondo","Ramos Mejía":"Ramos"};
const rectHit=(a,b)=>!(a.x+a.width<b.x||b.x+b.width<a.x||a.y+a.height<b.y||b.y+b.height<a.y);
function acomodarNombres(){
  // TAMAÑO REAL, NO EN UNIDADES DEL SVG. El viewBox mide 1000 de ancho pero el
  // mapa se dibuja mucho más chico (en un celular, ~375px): una fuente de 16
  // unidades terminaba viéndose a 6px. Calculamos la escala y fijamos el tamaño
  // para que en PANTALLA se lea siempre parecido, mida lo que mida el mapa.
  const escala=(svg.getBoundingClientRect().width||560)/1000;
  const uni=px=>px/escala;                 // px reales -> unidades del SVG
  const FS_IDEAL=uni(17), FS_MIN=uni(12.5);
  els.forEach(o=>{let fs=FS_IDEAL;if(SHORT[o.data.n])o.t.textContent=SHORT[o.data.n];o.t.style.fontSize=fs+"px";
    const mw=o.box.w*0.98;let l=o.t.getComputedTextLength();
    while(l>mw&&fs>FS_MIN){fs-=uni(.5);o.t.style.fontSize=fs+"px";l=o.t.getComputedTextLength()}o.tooWide=l>mw;});
  const placed=[];
  // Antes se ocultaba el nombre si no entraba en el polígono ('tooWide'), y por eso
  // desaparecían justo las zonas angostas: Ciudadela, Ramos y V. Sarmiento. Ahora
  // un nombre que sobresale un poco se muestra igual —es mejor que no verlo— y
  // solo se oculta si de verdad se pisa con otro ya colocado.
  els.slice().sort((a,b)=>b.area-a.area).forEach(o=>{
    let r;try{r=o.t.getBBox()}catch(e){r=null}
    const rr=r?{x:r.x+r.width*0.18,y:r.y+r.height*0.3,width:r.width*0.64,height:r.height*0.4}:null;
    const hide=o.box.w<18||(rr&&placed.some(p=>rectHit(rr,p)));
    // Se tolera el roce: solo se oculta si los nombres se pisan de verdad, no si
    // apenas se rozan por el borde. Sin esta tolerancia se perdían nombres de
    // zonas grandes (Hurlingham) por tocar el vecino de costado.
    if(hide){o.t.style.opacity=0;o.small=true}
    else{o.t.style.opacity=1;o.small=false;
      if(r)placed.push({x:r.x+r.width*0.18,y:r.y+r.height*0.3,width:r.width*0.64,height:r.height*0.4});}
  });
}
// Se corre cuando el mapa YA tiene su tamaño final (en rAF todavía puede medir
// mal y los nombres quedan calculados para un ancho que no es el real), y de
// nuevo al rotar el celular o cambiar el tamaño de la ventana.
requestAnimationFrame(acomodarNombres);
window.addEventListener('load', acomodarNombres);
let _rz; window.addEventListener('resize', ()=>{ clearTimeout(_rz); _rz=setTimeout(acomodarNombres,150); });

const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
document.getElementById("q").addEventListener("input",e=>doSearch(e.target.value));
function doSearch(v){
  const q=norm(v);
  els.forEach(o=>{o.g.classList.remove("on","keep","dim");if(o.small)o.t.style.opacity=0});
  if(!q){banner.innerHTML="Buscá tu localidad o tocá tu zona en el mapa 🚚";return}
  const hits=els.filter(o=>norm(o.data.n).includes(q));
  els.forEach(o=>{if(!hits.includes(o))o.g.classList.add("dim")});
  if(hits.length){hits.forEach(o=>{o.g.classList.add("on","keep");if(o.small)o.t.style.opacity=1});
    const _n=hits[0].data.n;
    banner.innerHTML=`<span class="ok">✓ ¡Sí! Repartimos en <b>${_n}</b></span>`+(DIAS[_n]?`<div style="margin-top:3px;color:#1c1c1c">📅 Día de reparto: <b style="color:#F58220">${DIAS[_n]}</b></div>`:'')}
  else banner.innerHTML=`<span class="no">No encontramos “${v}”. Escribinos y lo vemos 💬</span>`;
}

// ── DÍAS DE ENTREGA por localidad, tomados de la CONFIGURACIÓN del Drive ──
// (el mismo Apps Script que la lista). UNA sola fuente: cambiás los días en la
// planilla y el mapa se actualiza solo. Villa Udaondo hereda el día de Ituzaingó.
(function(){
  const API='https://script.google.com/macros/s/AKfycbwH6JW35BRYcBk958OEr4sEvfVIfzgqzQeGwvz63xZYgukwxik8EsIego4d9O456bHURg/exec';
  const NOM={LUNES:'Lunes',MARTES:'Martes',MIERCOLES:'Miércoles',JUEVES:'Jueves',VIERNES:'Viernes',SABADO:'Sábado',DOMINGO:'Domingo'};
  const fmt=arr=>{const d=(arr||[]).map(x=>{const k=norm(x).toUpperCase();return NOM[k]||x;});
    if(d.length>=6)return'Todos (lunes a sábado)';
    if(d.length<=1)return d.join('');
    return d.slice(0,-1).join(', ')+' y '+d[d.length-1];};
  fetch(API+'?lista=minorista').then(r=>r.json()).then(dd=>{
    const zonas=(dd&&dd.config&&dd.config.zonas)?dd.config.zonas:null; if(!zonas)return;
    zonas.forEach(z=>{
      const dias=fmt(z.dias); if(!dias)return;
      const locs=String(z.nombre||'').split(/[,·\/]/).map(s=>norm(s)).filter(Boolean);
      MAPDATA.cells.forEach(c=>{ const cn=norm(c.n);
        if(locs.some(l=>l&&(cn.indexOf(l)>=0||l.indexOf(cn)>=0))) DIAS[c.n]=dias; });
    });
    if(!DIAS['Villa Udaondo']&&DIAS['Ituzaingó']) DIAS['Villa Udaondo']=DIAS['Ituzaingó'];
  }).catch(()=>{});
})();
</script>
</body>
</html>
